name: Release

# Publica no npm quando uma tag de versão (v1.2.3) é enviada.
# Use: npm run release -- patch   (depois: git push --follow-tags)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # criar a GitHub Release
  id-token: write   # Trusted Publishing (OIDC) e provenance do npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Confere se a tag bate com a versão da lib
        run: |
          PKG_VERSION=$(node -p "require('./projects/chamfer-ui/package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $PKG_VERSION em projects/chamfer-ui/package.json"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # Trusted Publishing (OIDC): o npm confia neste workflow, sem token salvo.
      # Requer npm 11.5.1 ou superior.
      - name: Atualiza o npm
        run: npm install --global npm@latest

      - name: Publica no npm
        working-directory: dist/chamfer-ui
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION já está no npm. Pulando a publicação."
            exit 0
          fi
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          npm publish --access public --tag "$TAG"

      - name: Cria a GitHub Release
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
